{{- if .Values.enabled }}
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster
  labels:
    release: monitoring
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: external
        port: 9093
        type: nodeport
        tls: false
      - name: tls
        port: 9094
        type: internal
        tls: true
    config:
      num.partitions: 256
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: "3.7"
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics-config
          key: kafka-metrics.yaml
    template:
      pod:
        metadata:
          labels:
            kafka-metrics: "true"
    storage:
      type: ephemeral

  zookeeper:
    replicas: 3
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: zookeeper-metrics-config
          key: zookeeper-metrics.yaml
    template:
      pod:
        metadata:
          labels:
            kafka-metrics: "true"
    storage:
      type: ephemeral
  entityOperator:
    topicOperator: {}
    userOperator: {}
{{- end }}
